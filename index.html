<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><title>幻境學園：卡牌戰紀</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#19263b;--line:#34445e;--mint:#78d7d0;--gold:#ffd780;--text:#eef4ff;--muted:#a6b4cb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2b4566,#101827 65%);color:var(--text);font:16px/1.5 system-ui,"Noto Sans TC",sans-serif;min-height:100vh}header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#101827dd;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(1.25rem,3vw,2rem)}h2{margin:0 0 12px}.eyebrow{color:var(--mint);letter-spacing:.13em;font-size:.75rem;margin:0 0 5px}.muted{color:var(--muted);font-size:.9rem}.wrap{max-width:1100px;margin:auto;padding:22px 16px 38px;display:grid;gap:16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#111b2b;border-radius:999px;padding:7px 12px;color:var(--gold);font-weight:700}.panel{background:linear-gradient(145deg,#1c2b42,#152136);border:1px solid var(--line);border-radius:18px;padding:clamp(15px,3vw,24px);box-shadow:0 12px 32px #0002}.arena{display:grid;grid-template-columns:1fr 36px 1fr;gap:12px;align-items:stretch}.fighter{background:#101b2c;border:1px solid #2c3e59;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.avatar{width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:3.3rem;background:linear-gradient(145deg,#2e4a6b,#1b2a40);border:1px solid #45607e;margin-bottom:9px}.enemy .avatar{background:linear-gradient(145deg,#5b3049,#2a2039)}.fighter h3{margin:0 0 3px;font-size:1.08rem}.hp-label{width:100%;display:flex;justify-content:space-between;font-size:.82rem;margin:13px 0 5px}.bar{height:10px;width:100%;background:#344055;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#50d6a5,#a6edba);transition:width .25s}.enemy .fill{background:linear-gradient(90deg,#ff647c,#ffb06e)}.versus{display:grid;place-items:center;font-weight:900;color:var(--mint)}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.primary{background:linear-gradient(100deg,#78d7d0,#7ee0b1);color:#10202a}.secondary{background:#2b3b55;color:var(--text);border:1px solid #4a5d79}.danger{background:#3a2636;color:#ffb9c3;border:1px solid #714051}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.notice{margin-top:14px;border-radius:12px;padding:13px 15px;background:#111b2b;border:1px solid #2d405b;min-height:50px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reward{color:var(--gold);font-weight:800}.log{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow:auto}.logline{border-left:3px solid #4d6b8b;padding:6px 10px;background:#111b2b;border-radius:0 8px 8px 0;font-size:.9rem}.foot{text-align:center;color:var(--muted);font-size:.8rem}@media(max-width:650px){.arena{grid-template-columns:1fr 22px 1fr;gap:6px}.fighter{padding:11px 8px}.avatar{width:68px;height:68px;font-size:2.5rem;border-radius:18px}.lower{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.wrap{padding:14px 10px 26px}}
</style></head><body>
<header><div><p class="eyebrow">BROWSER MINI GAME</p><h1>幻境學園：卡牌戰紀</h1></div><div class="pill">✦ 校園冒險・第一章</div></header>
<main class="wrap"><section class="topline"><div><p class="eyebrow">STAGE <span id="stageTop">1</span></p><h2 id="stageTitle">第 1 關：訓練場的挑戰</h2><div class="muted">點擊攻擊，打敗敵人即可前往下一關。</div></div><div class="pill">🪙 金幣 <span id="coinsTop">0</span></div></section>
<section class="panel"><div class="arena">
<div class="fighter"><div class="avatar">🎓</div><h3>林雨晴</h3><div class="muted">學園新生・玩家</div><div class="hp-label"><span>生命值</span><b id="playerHpText">100 / 100</b></div><div class="bar"><div class="fill" id="playerHpBar"></div></div><div class="muted" style="margin-top:9px">攻擊力：<b id="playerAtk">18</b></div></div><div class="versus">VS</div>
<div class="fighter enemy"><div class="avatar" id="enemyAvatar">👾</div><h3 id="enemyName">校園史萊姆</h3><div class="muted" id="enemyDesc">第一個練習對手</div><div class="hp-label"><span>生命值</span><b id="enemyHpText">55 / 55</b></div><div class="bar"><div class="fill" id="enemyHpBar"></div></div><div class="muted" style="margin-top:9px">攻擊力：<b id="enemyAtk">7</b></div></div></div>
<div class="actions"><button class="btn primary" id="attackBtn">⚔️ 攻擊</button><button class="btn secondary" id="healBtn">💚 使用補給（回復 20）</button></div><div class="notice" id="notice" role="status" aria-live="polite">冒險開始！按下「攻擊」挑戰眼前的敵人。</div></section>
<div class="lower"><section class="panel"><h2>📘 冒險紀錄</h2><div class="muted" style="margin-bottom:12px">每次勝利都會獲得金幣，敵人也會逐漸變強。</div><div class="topline"><span>已通過關卡</span><strong id="cleared">0</strong></div><div class="topline" style="margin-top:9px"><span>本關勝利獎勵</span><strong class="reward" id="reward">+10 金幣</strong></div><div class="topline" style="margin-top:9px"><span>補給次數</span><strong id="potions">3</strong></div></section>
<section class="panel"><h2>🗒️ 戰鬥紀錄</h2><div class="log" id="log"><div class="logline">你踏入學園訓練場，準備開始冒險。</div></div><button class="btn danger" id="resetBtn" style="width:100%;margin-top:14px">重新開始遊戲</button></section></div><div class="foot">進度儲存在這個瀏覽器。清除瀏覽器資料或更換裝置可能會使存檔消失。</div></main>
<script>
(()=>{const $=id=>document.getElementById(id);const defaults=()=>({stage:1,coins:0,cleared:0,playerHp:100,potions:3,enemyHp:55});let state;try{state={...defaults(),...JSON.parse(localStorage.getItem('campusCardMiniSave')||'{}')}}catch(e){state=defaults()}
const enemies=[{name:'校園史萊姆',desc:'第一個練習對手',icon:'👾',hp:55,atk:7,reward:10},{name:'迷路的魔像',desc:'石頭外殼堅硬',icon:'🪨',hp:75,atk:10,reward:15},{name:'夜巡影獸',desc:'擅長突襲的敵人',icon:'🐺',hp:95,atk:13,reward:20},{name:'幻境守門者',desc:'訓練場首領',icon:'🐉',hp:125,atk:16,reward:30}];
function enemy(){const b=enemies[(state.stage-1)%enemies.length],s=Math.floor((state.stage-1)/enemies.length);return {...b,hp:b.hp+s*35,atk:b.atk+s*4,reward:b.reward+s*5}}
function save(){try{localStorage.setItem('campusCardMiniSave',JSON.stringify(state))}catch(e){}}
function addLog(t){const n=document.createElement('div');n.className='logline';n.textContent=t;$('log').prepend(n);while($('log').children.length>8)$('log').lastElementChild.remove()}
function tell(t){$('notice').textContent=t}
function render(){const e=enemy();$('stageTop').textContent=state.stage;$('stageTitle').textContent='第 '+state.stage+' 關：'+(['訓練場的挑戰','古老石階','暮色校園','幻境之門'][(state.stage-1)%4]);$('coinsTop').textContent=state.coins;$('playerHpText').textContent=state.playerHp+' / 100';$('playerHpBar').style.width=Math.max(0,state.playerHp)+'%';$('playerAtk').textContent=18+Math.floor((state.stage-1)/3)*2;$('enemyName').textContent=e.name;$('enemyDesc').textContent=e.desc;$('enemyAvatar').textContent=e.icon;$('enemyHpText').textContent=Math.max(0,state.enemyHp)+' / '+e.hp;$('enemyHpBar').style.width=Math.max(0,state.enemyHp/e.hp*100)+'%';$('enemyAtk').textContent=e.atk;$('cleared').textContent=state.cleared;$('reward').textContent='+'+e.reward+' 金幣';$('potions').textContent=state.potions;$('attackBtn').disabled=state.playerHp<=0||state.enemyHp<=0;$('healBtn').disabled=state.playerHp<=0||state.playerHp>=100||state.potions<=0||state.enemyHp<=0;save()}
function nextStage(){state.stage++;state.playerHp=Math.min(100,state.playerHp+25);state.enemyHp=enemy().hp;$('attackBtn').textContent='⚔️ 攻擊';$('attackBtn').onclick=attack;tell('進入第 '+state.stage+' 關！你恢復了 25 點生命值。');addLog('進入第 '+state.stage+' 關。');render()}
function win(){const e=enemy();state.coins+=e.reward;state.cleared++;state.enemyHp=0;tell('🎉 勝利！獲得 '+e.reward+' 枚金幣。按「前往下一關」繼續冒險。');$('attackBtn').textContent='➡️ 前往下一關';$('attackBtn').disabled=false;$('healBtn').disabled=true;addLog('打敗 '+e.name+'，獲得 '+e.reward+' 金幣。');$('attackBtn').onclick=nextStage;render()}
function attack(){if(state.playerHp<=0||state.enemyHp<=0)return;const e=enemy(),d=18+Math.floor((state.stage-1)/3)*2+Math.floor(Math.random()*8);state.enemyHp=Math.max(0,state.enemyHp-d);addLog('林雨晴發動攻擊，造成 '+d+' 點傷害。');if(state.enemyHp<=0){render();win();return}const hit=e.atk+Math.floor(Math.random()*5);state.playerHp=Math.max(0,state.playerHp-hit);addLog(e.name+' 反擊，造成 '+hit+' 點傷害。');if(state.playerHp<=0){tell('💫 你暫時失去戰鬥能力！按「重新開始遊戲」再次挑戰。');addLog('你被擊倒了。')}else tell('你造成 '+d+' 點傷害，敵人反擊造成 '+hit+' 點傷害。');render()}
function heal(){if(state.potions<=0||state.playerHp>=100||state.enemyHp<=0)return;const a=Math.min(20,100-state.playerHp);state.playerHp+=a;state.potions--;addLog('使用補給，恢復 '+a+' 點生命值。');tell('補給生效！恢復 '+a+' 點生命值。');render()}
function reset(){if(!confirm('確定要刪除目前進度並重新開始嗎？'))return;state=defaults();$('log').innerHTML='<div class="logline">新旅程開始！祝你冒險順利。</div>';$('attackBtn').textContent='⚔️ 攻擊';$('attackBtn').onclick=attack;tell('冒險開始！按下「攻擊」挑戰眼前的敵人。');render()}
$('attackBtn').onclick=attack;$('healBtn').onclick=heal;$('resetBtn').onclick=reset;if(!Number.isFinite(state.stage)||state.stage<1)state=defaults();if(state.enemyHp<=0)state.enemyHp=enemy().hp;if(state.playerHp<=0)tell('你目前已經被擊倒。按「重新開始遊戲」再次挑戰。');render()})();
</script></body></html>
