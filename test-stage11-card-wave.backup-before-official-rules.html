.featured-section{min-width:0;padding:4px 0}
.featured-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.featured-card{position:relative;display:flex;align-items:stretch;min-width:0;overflow:hidden;min-height:210px;border:1px solid #7867a5;border-radius:18px;background:radial-gradient(circle at 10% 0%,#8873bd30,transparent 48%),linear-gradient(145deg,#273650,#141f32);box-shadow:0 12px 28px #0002}
.featured-card.featured-sr{border-color:#557c9e;background:radial-gradient(circle at 10% 0%,#78d7d022,transparent 48%),linear-gradient(145deg,#223b50,#141f32)}
.featured-card img{display:block;width:44%;max-width:220px;min-width:130px;flex:0 0 44%;height:auto;object-fit:contain;object-position:center center;align-self:stretch;mask-image:none;background:transparent;image-rendering:auto}
.featured-info{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;padding:18px 16px 18px 22px;min-width:0}
.featured-tag{font-size:.72rem;color:#e3d5ff;letter-spacing:.04em}
.featured-sr .featured-tag{color:#9ce7df}
.featured-info h3{margin:2px 0 3px;font-size:1.15rem}
.featured-info p{margin:0;color:#bac8dc;font-size:.83rem;line-height:1.75}
.featured-info .btn{padding:8px 12px;font-size:.85rem;margin-top:4px}
@media(max-width:800px){.featured-grid{grid-template-columns:1fr}.featured-card{min-height:175px}.featured-card img{width:32%;max-width:135px}.featured-info{padding-right:18px}}
@media(max-width:380px){.featured-card img{min-width:80px;width:30%}.featured-info h3{font-size:1rem}.featured-info p{font-size:.78rem}}

/* Homepage featured-character detail modal */
.featured-card{cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.featured-card:hover,.featured-card:focus-visible{transform:translateY(-2px);border-color:var(--mint);box-shadow:0 14px 34px #0004;outline:none}
.featured-card:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.featured-detail-backdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:#050b16d9;backdrop-filter:blur(6px)}
.featured-detail-backdrop[hidden]{display:none}
.featured-detail-dialog{position:relative;width:min(960px,100%);max-height:min(88dvh,850px);overflow:auto;box-sizing:border-box;padding:clamp(18px,3vw,30px);border:1px solid #7867a5;border-radius:22px;background:linear-gradient(145deg,#202a45,#151f32);color:var(--text);box-shadow:0 24px 90px #0009}
.featured-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.featured-detail-head h2{margin:4px 0 0;font-size:clamp(1.35rem,3vw,2rem)}
.featured-detail-close{flex:none;width:42px;height:42px;border:1px solid #526580;border-radius:11px;background:#142237;color:var(--text);font-size:1.25rem;cursor:pointer}
.featured-detail-layout{display:grid;grid-template-columns:minmax(190px,.78fr) minmax(0,1.22fr);gap:clamp(18px,3vw,30px);align-items:start}
.featured-detail-art{display:grid;place-items:center;min-width:0;padding:12px;border:1px solid #344b68;border-radius:16px;background:#101b2c}
.featured-detail-art img{display:block;width:auto;height:auto;max-width:100%;max-height:60dvh;object-fit:contain}
.featured-detail-info{min-width:0}.featured-detail-info .character-role{color:var(--mint);font-weight:800;margin:0 0 10px}.featured-detail-info p{line-height:1.8}.featured-detail-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 22px}.featured-detail-stats>div{padding:14px;border-radius:13px;background:#101b2c;border:1px solid #263951;min-width:0}.featured-detail-stats small{display:block;color:#9fb3d0;margin-bottom:6px}.featured-detail-stats strong{font-size:1.12rem;color:#ffe29a;overflow-wrap:anywhere}.featured-detail-info h3{font-size:1.1rem;margin:18px 0 8px}
@media(max-width:640px){.featured-detail-backdrop{padding:10px}.featured-detail-dialog{padding:16px;border-radius:16px;max-height:92dvh}.featured-detail-layout{grid-template-columns:minmax(0,1fr);gap:16px}.featured-detail-art img{max-height:42dvh}.featured-detail-stats>div{padding:11px}.featured-detail-stats strong{font-size:1rem}}

/* Daily login reward popup */
.daily-reward-popup{text-align:center;padding:8px 0 4px}
.daily-reward-glow{display:grid;place-items:center;width:82px;height:82px;margin:0 auto 12px;border:1px solid #f3d58a88;border-radius:50%;background:radial-gradient(circle,#f5d58b33,#b98a3510 70%);font-size:2.7rem;box-shadow:0 0 34px #e8c86c20}
.daily-reward-popup h2{font-size:clamp(1.45rem,5vw,2rem);margin:5px 0 8px}
.daily-reward-sub{color:#bdcce0;line-height:1.7}
.daily-reward-total{margin:18px auto;padding:17px;border:1px solid #d5b96c88;border-radius:16px;background:linear-gradient(145deg,#443b2a,#1c293a)}
.daily-reward-total>span,.daily-reward-total p{display:block;color:#e2d4b5;font-size:.85rem}
.daily-reward-total>strong{display:block;margin:4px 0;color:#ffe08b;font-size:2.3rem}
.daily-reward-total>strong small{font-size:.95rem}
.daily-reward-total p{margin:0}
.daily-streak-title{display:flex;flex-direction:column;gap:4px;text-align:left;margin:18px 0 10px}
.daily-streak-title span{font-size:.78rem;color:#aabbd1}
.daily-streak-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.daily-streak-day{display:grid;gap:5px;padding:10px 3px;border:1px solid #43536b;border-radius:11px;background:#121e30;color:#91a2bb;font-size:.75rem}
.daily-streak-day strong{font-size:.95rem;color:#d2dceb}
.daily-streak-day small{font-size:.68rem}
.daily-streak-day.earned{border-color:#bba05b;background:linear-gradient(150deg,#54482b,#202b3b);color:#f8d983}
.daily-streak-day.earned strong{color:#ffe49a}
.daily-reward-close{width:100%;margin-top:18px;min-height:48px}
@media(max-width:380px){.daily-streak-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Test: original-size character artwork lightbox */
.roster-art-lightbox{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.88);backdrop-filter:blur(4px)}
.roster-art-lightbox[hidden]{display:none}
.roster-art-lightbox img{display:block;width:auto;height:auto;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);object-fit:contain;image-rendering:auto;cursor:default}
.roster-art-lightbox-close{position:fixed;top:14px;right:16px;width:44px;height:44px;border:1px solid #ffffff66;border-radius:50%;background:#101522dd;color:#fff;font-size:28px;line-height:1;cursor:pointer}
.roster-card-art img,.roster-detail-art img{cursor:zoom-in}
@media(max-width:600px){.roster-art-lightbox{padding:12px}.roster-art-lightbox img{max-width:calc(100vw - 24px);max-height:calc(100vh - 24px)}.roster-art-lightbox-close{top:8px;right:8px}}

/* Character inventory/cultivation UI — keep production styling aligned with story test */
.inventory-balance{display:flex;align-items:center;gap:12px;box-sizing:border-box;width:100%;padding:14px 16px;margin:14px 0 16px;border:1px solid #b89543;border-radius:14px;background:linear-gradient(120deg,#3b3428,#18263a);color:#f6d47b}
.inventory-balance span{color:#d6dfed;font-weight:700}
.inventory-balance strong{margin-left:auto;font-size:clamp(1.25rem,4vw,1.8rem);font-variant-numeric:tabular-nums;white-space:nowrap}
.inventory-toolbar{display:grid;gap:12px;margin:14px 0 16px}
.inventory-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inventory-filter{appearance:none;border:1px solid #4c6280;background:#142239;color:#c9d7e9;border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;line-height:1.25;cursor:pointer}
.inventory-filter.active{background:#d7bd72;color:#182337;border-color:#f0d995}
.inventory-sort{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;color:var(--muted);font-size:.95rem}
.inventory-sort select{box-sizing:border-box;width:100%;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid #465c7b;background:#111d2e;color:var(--text);font:inherit}
.inventory-count{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.inventory-list{display:grid;gap:10px}
.inventory-item{display:flex;align-items:center;gap:12px;box-sizing:border-box;min-width:0;padding:10px 12px;border:1px solid #3a4e6a;border-radius:14px;background:#111d2e}
.inventory-item>img{display:block;flex:0 0 64px;width:64px;height:82px;object-fit:cover;object-position:center 20%;border-radius:10px;border:1px solid #9b80d2}
.inventory-item .inv-icon{flex:0 0 64px;text-align:center;font-size:1.6rem}
.inventory-item .inv-meta{flex:1;min-width:0}
.inventory-item .inv-meta strong{display:block;line-height:1.45;margin-bottom:5px}
.inventory-item small{display:block;color:var(--muted);line-height:1.55;margin-top:2px}
.inventory-rarity{display:inline-block;margin-left:5px;padding:2px 7px;border-radius:999px;background:#34425a;color:#dce7f5;font-size:.72rem;vertical-align:2px}
.inventory-item .btn{flex:0 0 auto;min-width:84px;min-height:46px;white-space:nowrap}
.inventory-item .btn:disabled{opacity:.55;cursor:not-allowed}
.inventory-empty{padding:18px;border:1px dashed #4c6280;border-radius:12px;color:var(--muted);text-align:center}
@media(max-width:560px){
 .inventory-balance{padding:11px 12px;gap:8px}
 .inventory-filters{gap:6px}
 .inventory-filter{padding:8px 11px;font-size:.88rem}
 .inventory-sort{grid-template-columns:1fr;gap:6px}
 .inventory-item{gap:9px;padding:9px}
 .inventory-item>img{flex-basis:54px;width:54px;height:72px}
 .inventory-item .inv-icon{flex-basis:54px}
 .inventory-item .inv-meta strong{font-size:.9rem}
 .inventory-item .inv-meta small{font-size:.78rem}
 .inventory-item .btn{min-width:68px;min-height:42px;padding:9px 8px;font-size:.84rem}
}


/* Force visible selected/focused filter state on touch browsers */
.inventory-filters .inventory-filter{ -webkit-tap-highlight-color:rgba(215,189,114,.28);touch-action:manipulation; }
.inventory-filters .inventory-filter.active,
.inventory-filters .inventory-filter[aria-pressed="true"]{background:#d7bd72!important;color:#182337!important;border-color:#f0d995!important;box-shadow:inset 0 0 0 1px #f0d995,0 0 0 2px rgba(215,189,114,.14)!important}
.inventory-filters .inventory-filter:focus-visible{outline:2px solid #f0d995;outline-offset:2px}
.inventory-filters .inventory-filter:active{background:#c6a956;color:#182337}


/* High-specificity filter states for mobile embedded browsers */
.inventory-filters button.inventory-filter{background:#17263b!important;color:#dce7f5!important;border:1px solid #607895!important;box-shadow:none!important;border-radius:999px!important}
.inventory-filters button.inventory-filter.active,
.inventory-filters button.inventory-filter[aria-pressed="true"]{background:linear-gradient(180deg,#f5dc91,#d7bd72)!important;color:#172337!important;border:2px solid #fff0bd!important;box-shadow:0 2px 0 #9c7a36,inset 0 0 0 1px rgba(92,65,15,.18)!important;font-weight:800!important}
.inventory-filters button.inventory-filter:active{filter:brightness(.92)}


/* Approved battle layout: symmetric portrait cards, inner vertical HP bars, aligned stats. */
#gameApp #battlePanel{
  display:flex;flex-direction:column;align-items:stretch;gap:14px;
  padding:clamp(14px,2.5vw,26px);
  background:linear-gradient(145deg,#1c2d45,#101a2b);
  border:1px solid #405978;box-shadow:0 16px 42px #0003;
}
#gameApp #battlePanel>.party-sidebar{
  order:1;width:100%;min-width:0;box-sizing:border-box;
  background:#142237;border:1px solid #344b68;border-radius:14px;padding:12px;
}
#gameApp #battlePanel>.party-sidebar h3{margin:0 0 8px;color:var(--mint);font-size:14px}
#gameApp #battlePanel>.battle-arena{
  order:2;width:100%;min-width:0;box-sizing:border-box;
  display:grid;grid-template-columns:minmax(0,1fr) clamp(24px,3.5vw,42px) minmax(0,1fr);
  align-items:stretch;gap:clamp(8px,1.4vw,18px);
}
#gameApp .battle-arena>.player-fighter{grid-column:1;grid-row:1}
#gameApp .battle-arena>.versus{grid-column:2;grid-row:1;align-self:center;justify-self:center}
#gameApp .battle-arena>.fighter.enemy{grid-column:3;grid-row:1}
#gameApp .battle-arena>.fighter{
  box-sizing:border-box;width:100%;max-width:560px;min-width:0;min-height:800px;
  position:relative;overflow:hidden;justify-self:center;
  display:grid;grid-template-columns:minmax(0,1fr) 12px;
  grid-template-rows:auto auto auto auto;align-content:start;align-items:start;
  justify-items:stretch;column-gap:12px;row-gap:8px;
  padding:16px;border:1px solid #385775;border-radius:20px;
  background:linear-gradient(160deg,#203750,#19263b);text-align:center;
}
#gameApp .battle-arena>.fighter.enemy{
  grid-template-columns:12px minmax(0,1fr);
  background:linear-gradient(160deg,#402b46,#251f37);border-color:#64436d;
}
#gameApp .battle-arena>.player-fighter>.avatar{grid-column:1;grid-row:1}
#gameApp .battle-arena>.player-fighter>.bar{grid-column:2;grid-row:1}
#gameApp .battle-arena>.fighter.enemy>.avatar{grid-column:2;grid-row:1}
#gameApp .battle-arena>.fighter.enemy>.bar{grid-column:1;grid-row:1}
#gameApp .battle-arena>.fighter>.avatar{
  box-sizing:border-box;width:clamp(180px,26vw,400px);height:clamp(270px,38.5vw,600px);
  max-width:100%;min-width:0;margin:0;justify-self:center;align-self:start;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;
  background:transparent;border:0;font-size:1rem;
}
#gameApp .battle-arena>.fighter>.avatar img{
  display:block;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;
  object-fit:contain!important;object-position:center;border-radius:inherit;
}
#gameApp .battle-arena>.fighter>.bar{
  box-sizing:border-box;display:flex;flex-direction:column;width:12px;
  height:clamp(270px,38.5vw,600px);min-height:0;margin:0;padding:0;
  align-self:start;justify-self:center;position:relative;overflow:hidden;border-radius:999px;
  background:#080f1c;border:1px solid #ffffff1a;
}
#gameApp .battle-arena>.fighter>.bar>.fill{
  display:block;width:100%!important;height:100%;min-height:0;flex:0 0 auto;
  align-self:flex-start;margin-top:0;border-radius:999px;transition:height .28s ease,background .18s ease;
}
#gameApp .battle-arena>.fighter>.bar>.fill.hp-flash{animation:hpDamageFlash .42s ease}
#gameApp .battle-arena>.fighter>.bar.hp-flash>.fill{animation:hpDamageFlash .42s ease}
@keyframes hpDamageFlash{0%,100%{filter:none}35%,60%{filter:none;background:#ff334f!important;box-shadow:0 0 12px #ff334f}}
#gameApp .battle-arena>.fighter>.hp-damage-float{
  position:absolute;top:43%;z-index:8;pointer-events:none;white-space:nowrap;
  font-size:clamp(1rem,1.8vw,1.45rem);font-weight:1000;color:#ff465e;
  text-shadow:0 2px 5px #000,0 0 9px #ff263f88;animation:hpDamageFloat .9s ease forwards;
}
#gameApp .battle-arena>.fighter>.hp-damage-float.player-damage{right:14px}
#gameApp .battle-arena>.fighter>.hp-damage-float.enemy-damage{left:14px}
#gameApp .battle-arena>.fighter>.hp-damage-float.heal-number{color:#82ffc1;text-shadow:0 2px 5px #000,0 0 9px #37ffad88}
@keyframes hpDamageFloat{0%{opacity:0;transform:translateY(10px) scale(.75)}15%{opacity:1;transform:translateY(0) scale(1.12)}100%{opacity:0;transform:translateY(-24px) scale(.95)}}
#gameApp .battle-arena>.fighter>h3{
  grid-column:1/-1;grid-row:2;width:100%;min-width:0;margin:2px 0 0;
  font-size:clamp(1rem,1.5vw,1.35rem);line-height:1.35;overflow-wrap:anywhere;
}
#gameApp .battle-arena>.fighter>.fighter-description{display:none!important}
#gameApp .battle-arena>.fighter>.hp-label{
  grid-column:1/-1;grid-row:3;display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:8px;width:100%;margin:0;text-align:center;
  font-size:clamp(.82rem,1.3vw,1rem);line-height:1.4;
}
#gameApp .battle-arena>.fighter>.fighter-attack{
  grid-column:1/-1;grid-row:4;display:flex;justify-content:center;align-items:center;
  width:100%;min-height:1.4em;margin:0!important;font-size:clamp(.8rem,1.2vw,.95rem);
}
#gameApp .battle-arena>.versus{
  font-weight:900;font-size:clamp(1.1rem,2vw,1.7rem);letter-spacing:.12em;
  color:var(--gold);text-shadow:0 0 20px #f4d58a55;
}
#gameApp .battle-action-layout{
  order:3;width:100%;min-width:0;display:grid;
  grid-template-columns:minmax(0,45fr) minmax(0,55fr);
  grid-template-areas:"notice notice" "controls party";
  gap:12px 16px;align-items:start;
}
#gameApp .battle-action-left,#gameApp .battle-action-right{min-width:0}
#gameApp .battle-action-left{grid-area:controls}
#gameApp .battle-action-right{display:contents}
#gameApp .battle-action-right .notice{
  grid-area:notice;width:100%;min-width:0;min-height:0;margin:0;padding:12px 16px;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
#gameApp .battle-action-right .party-sidebar{grid-area:party;align-self:start;min-width:0}
#gameApp .battle-action-left .combat-bottom-controls{margin:0;height:auto;padding:0;background:transparent;border:0}
#gameApp .battle-action-left .energy-bar{margin-bottom:10px}
#gameApp .compact-combat-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#gameApp .compact-combat-controls>.btn{width:100%;min-width:0;min-height:54px;display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 8px}
#gameApp .compact-combat-controls #skillBtn{grid-column:auto}
#gameApp .compact-combat-controls #skillBtn{font-size:clamp(11px,1.05vw,15px);white-space:nowrap;letter-spacing:0;}
#gameApp .compact-combat-controls #skillBtn small{display:block;font-size:.78em;line-height:1.2;white-space:nowrap;}
#gameApp .lower{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
#gameApp .adventure-record-panel{display:none!important}
#gameApp .battle-history-panel{display:block!important}
#gameApp .battle-history-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
#gameApp .battle-history-heading h2{margin:0}
#gameApp .battle-history-hint{margin:8px 0 12px;font-size:12px}
#gameApp .log.recent-three:not(.show-all) .logline:nth-child(n+4){display:none}
#gameApp .log.show-all{max-height:420px}
#gameApp .nav-btn{border:1px solid #4a5d79;border-radius:10px;padding:8px 12px;background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer}
@media(max-width:900px){
  #gameApp #battlePanel>.battle-arena{gap:7px;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}
  #gameApp .battle-arena>.fighter{min-height:0;padding:10px 8px;column-gap:8px;row-gap:7px;border-radius:clamp(14px,2vw,20px)}
  #gameApp .battle-arena>.fighter>.avatar{width:clamp(125px,25vw,400px);height:clamp(188px,37.5vw,600px)}
  #gameApp .battle-arena>.fighter>.bar{height:clamp(188px,37.5vw,600px);width:clamp(9px,1vw,12px)}
  #gameApp .battle-arena>.fighter{grid-template-columns:minmax(0,1fr) 10px}
  #gameApp .battle-arena>.fighter.enemy{grid-template-columns:10px minmax(0,1fr)}
  #gameApp .battle-action-layout{grid-template-columns:minmax(0,1fr);gap:10px}
  #gameApp .battle-action-right .notice{min-height:90px}
  #gameApp .compact-combat-controls{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  #gameApp #battlePanel>.battle-arena{grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:4px}
  #gameApp .battle-arena>.fighter{min-height:0;padding:8px 5px;column-gap:5px;row-gap:6px;border-radius:14px}
  #gameApp .battle-arena>.fighter>.avatar{width:clamp(82px,25vw,180px);height:clamp(123px,37.5vw,270px);border-radius:10px}
  #gameApp .battle-arena>.fighter>.bar{height:clamp(123px,37.5vw,270px);width:8px}
  #gameApp .battle-arena>.fighter{grid-template-columns:minmax(0,1fr) 8px}
  #gameApp .battle-arena>.fighter.enemy{grid-template-columns:8px minmax(0,1fr)}
  #gameApp .battle-arena>.fighter>h3{font-size:clamp(.82rem,3.4vw,1rem)}
  #gameApp .battle-arena>.fighter>.hp-label{font-size:clamp(.66rem,2.7vw,.82rem);gap:4px}
  #gameApp .battle-arena>.fighter>.fighter-attack{font-size:clamp(.66rem,2.5vw,.8rem)}
  #gameApp .battle-action-right .notice{min-height:64px}
  #gameApp .compact-combat-controls #skillBtn{grid-column:auto}
}

<div class="arena battle-arena">
<div class="fighter player-fighter">
<div class="energy-hud player-energy-hud"><div class="bar energy-bar"><div class="fill energy-fill" id="playerEnergyBar"></div><span class="energy-bar-text" id="playerEnergyText">能量 45 / 100</span></div></div>
<div class="avatar player-portrait" id="playerAvatar"><img src="images/characters/lin-yuqing-sr.png" alt="三上悠亞"></div>
<h3 id="playerName">三上悠亞</h3><div class="muted fighter-description">學園新生・玩家</div>
<div class="bar hp-bar-with-text"><div class="fill" id="playerHpBar"></div><span class="hp-bar-text" id="playerHpText">HP 105 / 105</span></div>
<div class="muted fighter-attack">攻擊力：<b>18</b></div>
</div>
<div class="versus">VS</div>
<div class="enemy-wave-grid" id="enemyGrid" aria-label="敵方卡牌"></div>
</div>
<div class="battle-action-layout">
<div class="battle-action-left"><div class="combat-bottom-controls"><div class="compact-combat-controls">
<button class="btn primary" id="attackBtn" type="button">⚔️ 普通攻擊</button>
<button class="btn secondary" id="defendBtn" type="button">🛡️ 防禦</button>
<button class="btn secondary skill-quick-btn" id="skillBtn" type="button">✦ 必殺技 <small>消耗 35 能量</small></button>
<button class="btn secondary" id="healBtn" type="button">🧪 補給 <small>回復 50 HP</small></button>
</div></div><p class="test-mode-note">正常戰鬥規則：敵方反擊會實際扣除我方 HP；全隊倒下則戰鬥失敗。</p></div>
<div class="battle-action-right"><div class="notice" id="notice" role="status" aria-live="polite">請選擇敵方卡牌，再使用戰鬥指令。</div>
<aside class="party-sidebar"><h3>出戰隊員</h3><div id="battleParty" class="battle-party" aria-label="測試用隊伍">
<button type="button" class="battle-ally active"><img src="images/characters/lin-yuqing-sr.png" alt=""><span class="ally-name">三上悠亞</span><small class="ally-active-label">目前操作</small></button>
<button type="button" class="battle-ally"><img src="images/characters/su-yutong.png.png" alt=""><span class="ally-name">蘇語彤</span></button>
<button type="button" class="battle-ally"><img src="images/characters/shen-ruoxue.png" alt=""><span class="ally-name">沈若雪</span></button>
</div></aside></div>
</div>
</section>
<section class="panel battle-history-panel"><div class="battle-history-heading"><h2>🗒️ 戰鬥訊息</h2></div><div class="muted battle-history-hint">第11關正常戰鬥紀錄</div><div class="battle-log-label">一般戰鬥紀錄</div><div class="log recent-three" id="log" aria-live="polite"><div class="logline">測試戰鬥準備開始。</div></div></section>
<div class="foot">此頁只開放第11關戰鬥測試。未載入大廳、召喚、背包、任務、正式存檔與其他關卡。</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const roster=[
 {id:'yuching',name:'三上悠亞',rarity:'SR',role:'均衡型冒險者',image:'images/characters/lin-yuqing-sr.png',atk:22,skill:40,hp:118},
 {id:'yutong',name:'蘇語彤',rarity:'R',role:'友善支援',image:'images/characters/su-yutong.png.png',atk:11,skill:19,hp:84},
 {id:'ruoxue',name:'沈若雪',rarity:'SSR',role:'冰霜系策略型',image:'images/characters/shen-ruoxue.png',atk:24,skill:70,hp:122}
];
const waves=[
 [{id:'infected',name:'初始感染體',rarity:'R',hp:65,atk:8,energy:0,image:'新增圖片/敵方卡牌/stage-11.png',icon:'🧟‍♀️'},
  {id:'student',name:'感染學生',rarity:'R',hp:55,atk:7,energy:0,image:'',icon:'🧟'}],
 [{id:'fast',name:'高速感染體',rarity:'R',hp:60,atk:9,energy:0,image:'',icon:'🏃'},
  {id:'mutant',name:'異變感染體',rarity:'R',hp:75,atk:10,energy:0,image:'',icon:'👹'},
  {id:'infected2',name:'初始感染體',rarity:'R',hp:65,atk:8,energy:0,image:'新增圖片/敵方卡牌/stage-11.png',icon:'🧟‍♀️'}]
];
let wave=0,enemies=[],selected='infected',activeId='yuching',energy=0,defendNext=false,supplyUsed=false,busy=false,finished=false,defeated=false;
const partyHp=Object.fromEntries(roster.map(c=>[c.id,c.hp]));
function active(){return roster.find(c=>c.id===activeId)||roster[0]}
function aliveParty(){return roster.filter(c=>partyHp[c.id]>0)}
function aliveEnemies(){return enemies.filter(e=>e.hp>0)}
function addLog(message){const row=document.createElement('div');row.className='logline';row.textContent=message;$('log').prepend(row);while($('log').children.length>12)$('log').lastElementChild.remove()}
function tell(message){$('notice').textContent=message}
function floatDamage(host,text,heal=false){const el=document.createElement('span');el.className='damage-float'+(heal?' heal-number':'');el.textContent=text;$(host).append(el);setTimeout(()=>el.remove(),900)}
function updatePlayer(){
 const ch=active(),hp=partyHp[ch.id];
 $('playerName').textContent=ch.name;
 $('playerAvatar').innerHTML='<img src="'+ch.image+'" alt="'+ch.name+'" onerror="this.parentElement.textContent=\'🎓\'">';
 $('playerHpText').textContent='HP '+hp+' / '+ch.hp;
 $('playerHpBar').style.width=(hp/ch.hp*100)+'%';
 $('playerEnergyText').textContent='能量 '+energy+' / 100';
 $('playerEnergyBar').style.width=energy+'%';
 $('playerAtk').textContent=ch.atk;
 $('skillBtn').disabled=busy||finished||defeated||energy<35;
 $('healBtn').disabled=busy||finished||defeated||supplyUsed||hp>=ch.hp;
 $('attackBtn').disabled=busy||finished||defeated||aliveEnemies().length===0;
 $('defendBtn').disabled=busy||finished||defeated;
 $('battleParty').innerHTML=roster.map(c=>'<button type="button" class="battle-ally '+(c.id===activeId?'active':'')+'" data-member="'+c.id+'" '+(partyHp[c.id]<=0?'disabled':'')+'><img src="'+c.image+'" alt=""><span class="ally-name">'+c.name+'</span>'+(c.id===activeId?'<small class="ally-active-label">目前操作</small>':'')+'<span class="ally-hp">HP '+Math.max(0,partyHp[c.id])+' / '+c.hp+'</span></button>').join('');
}
function renderEnemies(){
 const alive=aliveEnemies();
 $('waveTag').textContent=(wave===0?'第一波':'第二波')+'｜'+alive.length+' / '+enemies.length+' 名存活';
 $('enemyGrid').innerHTML='';
 enemies.forEach(e=>{
  const card=document.createElement('article');
  card.className='fighter enemy'+(e.hp<=0?' dead':'')+(selected===e.id?' selected':'');
  card.setAttribute('role','button');card.setAttribute('tabindex',e.hp>0&&!busy&&!finished&&!defeated?'0':'-1');
  const art=e.image?'<img src="'+e.image+'" alt="'+e.name+'" onerror="this.remove();this.parentElement.textContent=\''+e.icon+'\'">':e.icon;
  card.innerHTML='<div class="energy-hud enemy-energy-hud"><div class="bar energy-bar"><div class="fill energy-fill" style="width:'+e.energy+'%"></div><span class="energy-bar-text">能量 '+e.energy+' / 100</span></div></div><div class="avatar">'+art+'</div><h3>'+e.name+' <small>['+e.rarity+']</small></h3><div class="muted fighter-description">基礎攻擊</div><div class="bar hp-bar-with-text"><div class="fill" style="width:'+Math.max(0,e.hp)/e.maxHp*100+'%"></div><span class="hp-bar-text">HP '+Math.max(0,e.hp)+' / '+e.maxHp+'</span></div><div class="muted fighter-attack">攻擊力：<b>'+e.atk+'</b></div>';
  const choose=()=>{if(busy||finished||defeated||e.hp<=0)return;selected=e.id;tell('已選取「'+e.name+'」，請選擇戰鬥操作。');render()};
  card.addEventListener('click',choose);card.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose()}});
  $('enemyGrid').append(card);
 });
}
function render(){renderEnemies();updatePlayer()}
function target(){return enemies.find(e=>e.id===selected&&e.hp>0)||aliveEnemies()[0]}
function loadWave(){
 enemies=waves[wave].map(e=>({...e,maxHp:e.hp}));
 selected=enemies[0].id;render();
 tell((wave===0?'第一波':'第二波')+'敵人登場！選擇敵方卡牌後進行攻擊。');
 addLog((wave===0?'第一波':'第二波')+'敵人登場。');
}
function checkBattleEnd(){
 if(aliveEnemies().length===0){
  if(wave===0){
   busy=true;render();tell('第一波全滅，第二波即將登場。');addLog('第一波全滅，準備迎戰第二波。');
   setTimeout(()=>{wave=1;busy=false;loadWave()},1000);
  }else{
   finished=true;render();tell('🎉 第二波全滅！第11關戰鬥測試勝利。');addLog('第二波全滅，測試戰鬥勝利。');
  }
  return true;
 }
 if(aliveParty().length===0){
  defeated=true;render();tell('💫 全隊角色倒下，戰鬥失敗。可重新開始測試。');addLog('全隊 HP 歸零，戰鬥失敗。');
  $('attackBtn').disabled=true;$('defendBtn').disabled=true;$('skillBtn').disabled=true;$('healBtn').disabled=true;
  return true;
 }
 return false;
}
function enemyTurn(){
 busy=true;render();
 const queue=aliveEnemies().slice();let i=0;
 function next(){
  if(i>=queue.length){busy=false;render();return}
  const enemy=queue[i++];
  if(enemy.hp<=0){next();return}
  enemy.energy=Math.min(100,enemy.energy+20);
  const ch=active();
  let damage=enemy.atk+Math.floor(Math.random()*5);
  if(defendNext){damage=Math.ceil(damage*.7);defendNext=false;addLog('防禦生效，本次受到傷害減少 30%。')}
  const before=partyHp[ch.id],actual=Math.min(before,damage);
  partyHp[ch.id]=Math.max(0,before-damage);
  floatDamage('playerAvatar','-'+actual);
  addLog(enemy.name+' 發動基礎攻擊，'+ch.name+' 受到 '+actual+' 點傷害；敵方能量 +20（'+enemy.energy+' / 100）。');
  if(partyHp[ch.id]<=0){
   addLog(ch.name+' 倒下了！');
   const nextMember=aliveParty()[0];
   if(nextMember){activeId=nextMember.id;tell(ch.name+' 倒下！自動切換至 '+nextMember.name+'。')}
  }else tell(enemy.name+' 反擊，造成 '+actual+' 點傷害。');
  render();
  if(checkBattleEnd())return;
  setTimeout(next,420);
 }
 next();
}
function finishPlayerAction(message){
 addLog(message);tell(message);render();
 if(!checkBattleEnd())enemyTurn();
}
function attack(){
 if(busy||finished||defeated)return;
 const e=target(),ch=active();if(!e)return;
 const damage=ch.atk+2*roster.length+Math.floor(Math.random()*5);
 const actual=Math.min(e.hp,damage);e.hp=Math.max(0,e.hp-damage);
 energy=Math.min(100,energy+10);floatDamage('enemyGrid','-'+actual);
 finishPlayerAction(ch.name+' 發動普通攻擊，對 '+e.name+' 造成 '+actual+' 點傷害，恢復 10 點能量。');
}
function useSkill(){
 if(busy||finished||defeated||energy<35)return;
 const ch=active(),e=target();if(!e)return;
 energy-=35;
 if(ch.id==='yutong'){
  let total=0;roster.forEach(member=>{const before=partyHp[member.id];partyHp[member.id]=Math.min(member.hp,before+25);total+=partyHp[member.id]-before});
  finishPlayerAction(ch.name+' 施放「先喝水再說！」，全隊各恢復 25 HP（共恢復 '+total+' HP）。');
 }else{
  const damage=ch.skill+Math.floor(Math.random()*5),actual=Math.min(e.hp,damage);e.hp=Math.max(0,e.hp-damage);
  if(ch.id==='keqing')defendNext=true;
  finishPlayerAction(ch.name+' 施放專屬必殺技，對 '+e.name+' 造成 '+actual+' 點傷害'+(ch.id==='keqing'?'，並使下一次受到的傷害減半。':'')+'，消耗 35 能量。');
 }
}
function defend(){
 if(busy||finished||defeated)return;
 defendNext=true;energy=Math.min(100,energy+5);
 finishPlayerAction(active().name+' 採取防禦姿態：下一次敵方攻擊傷害減少 30%，恢復 5 點能量。');
}
function heal(){
 if(busy||finished||defeated||supplyUsed)return;
 const ch=active(),before=partyHp[ch.id],after=Math.min(ch.hp,before+50),actual=after-before;
 if(actual<=0)return;
 partyHp[ch.id]=after;supplyUsed=true;floatDamage('playerAvatar','+'+actual,true);
 finishPlayerAction('使用本關補給，'+ch.name+' 恢復 '+actual+' HP（每場限用一次）。');
}
$('attackBtn').onclick=attack;
$('skillBtn').onclick=useSkill;
$('defendBtn').onclick=defend;
$('healBtn').onclick=heal;
$('battleParty').addEventListener('click',ev=>{
 const button=ev.target.closest('[data-member]');if(!button||button.disabled||busy||finished||defeated)return;
 const id=button.dataset.member;if(id===activeId)return;
 activeId=id;addLog('切換操作角色：'+active().name+'。');tell('已切換至 '+active().name+'。');render();
});
loadWave();render();
})();
</script>
</body></html>
