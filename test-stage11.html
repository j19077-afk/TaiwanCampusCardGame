<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101729">
<title>校園女神錄｜第11關多敵人戰鬥測試版</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d31;--line:#2d3c58;--text:#eef3ff;--muted:#9eacc6;--mint:#64e2c0;--pink:#ff718a;--gold:#ffd27a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2944 0%,var(--bg) 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
.wrap{width:min(980px,100%);margin:0 auto;padding:16px 14px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{font-weight:900;letter-spacing:.03em}.test-tag{font-size:12px;color:#20172a;background:var(--gold);font-weight:900;padding:5px 9px;border-radius:999px;white-space:nowrap}
.story{border:1px solid #4a467e;background:linear-gradient(125deg,#171d39,#25203f);border-radius:16px;padding:15px 17px;margin-bottom:14px}.story h1{font-size:clamp(20px,4vw,27px);margin:0 0 6px}.story p{color:#c5cce1;margin:0}
.statusline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 2px 10px}.wave-label{font-weight:900;color:var(--mint);letter-spacing:.04em}.remaining{font-size:13px;color:var(--muted)}
.enemy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.enemy-card{min-width:0;text-align:left;color:var(--text);position:relative;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#1b2740,#121a2b);padding:12px 11px 13px;transition:border-color .15s,transform .15s,box-shadow .15s;overflow:hidden}
.enemy-card:hover:not(:disabled){transform:translateY(-2px);border-color:#8b9ec5}.enemy-card.selected{border:2px solid var(--gold);padding:11px 10px 12px;box-shadow:0 0 0 3px #ffd27a20,0 0 22px #ffd27a15}.enemy-card.selected:after{content:"已選取目標";display:block;font-size:11px;color:var(--gold);font-weight:800;margin-top:8px}
.enemy-card.dying{animation:vanish .48s ease forwards;pointer-events:none}.enemy-art{height:94px;display:grid;place-items:center;margin:-2px -2px 8px;border-radius:10px;background:radial-gradient(ellipse,#344765 0%,#1a2438 65%,transparent 100%);font-size:54px;filter:drop-shadow(0 8px 8px #0005)}.enemy-name{font-size:15px;font-weight:900;overflow-wrap:anywhere}.enemy-type{color:var(--muted);font-size:12px;min-height:18px;margin:2px 0 9px}
.hp-row{display:flex;justify-content:space-between;gap:5px;font-size:11px;color:#dbe5fa;margin-bottom:5px}.hp-track{height:8px;background:#354057;border-radius:999px;overflow:hidden}.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff647c,#ffb06e);transition:width .22s}.atk{font-size:12px;color:#b8c5dc;margin-top:8px}.atk b{color:#f4f6ff}
.battle-board{margin-top:14px;border:1px solid var(--line);border-radius:17px;background:#111a2a;padding:15px}.board-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.board-heading h2{font-size:16px;margin:0}.player-card{display:grid;grid-template-columns:74px minmax(0,1fr);gap:13px;align-items:center}.player-avatar{height:74px;width:74px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#314a67,#1b2b43);font-size:39px}.player-name{font-weight:900;font-size:16px}.player-sub{font-size:12px;color:var(--muted);margin:2px 0 9px}.player-hp-label,.energy-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:7px 0 5px}.player-hp-track,.energy-track{height:10px;background:#354057;border-radius:999px;overflow:hidden}.player-hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#50d6a5,#a6edba);transition:width .2s}.energy-fill{height:100%;width:60%;background:linear-gradient(90deg,#61aaff,#a18cff);transition:width .2s}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:15px}.action{border:1px solid #3a4c69;background:#202d44;color:var(--text);border-radius:11px;padding:12px 7px;font-weight:800}.action.primary{background:linear-gradient(135deg,#64e2c0,#86f0d6);color:#10252b;border-color:transparent}.action:hover:not(:disabled){filter:brightness(1.08)}.action small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:3px}
.notice{margin-top:12px;border-radius:11px;background:#0d1422;border:1px solid #26334a;padding:11px 12px;color:#d7e2f8;min-height:45px;font-size:13px}.log{margin-top:12px}.log h3{font-size:13px;margin:0 0 7px;color:#b5c3dd}.log-list{max-height:145px;overflow:auto;display:flex;flex-direction:column;gap:5px}.log-item{font-size:12px;color:#b9c5da;padding:5px 8px;border-left:2px solid #344967;background:#182237;border-radius:0 6px 6px 0}
.footer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px}.reset{border:1px solid #50617b;background:transparent;color:#d5e0f4;border-radius:9px;padding:8px 12px;font-size:12px}.footnote{font-size:11px;color:#8291ab}
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#070b15d9;backdrop-filter:blur(6px)}.overlay.show{display:flex}.overlay-box{width:min(400px,100%);padding:25px 22px;border-radius:18px;border:1px solid #5a568e;background:linear-gradient(145deg,#171f3b,#282043);text-align:center;box-shadow:0 20px 70px #0008}.overlay-box h2{margin:0 0 8px}.overlay-box p{color:#c1cce0;margin:0 0 18px}.overlay-box button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--mint);color:#10252b;font-weight:900}
@keyframes vanish{0%{opacity:1;transform:scale(1);filter:grayscale(0)}35%{opacity:.8;transform:scale(.94) rotate(-2deg);filter:grayscale(.8)}100%{opacity:0;transform:scale(.72) translateY(12px);filter:grayscale(1)}}
@keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.enemy-card.arrive{animation:arrive .42s ease both}
@media(max-width:560px){.wrap{padding:11px 10px 25px}.story{padding:13px}.enemy-grid{gap:7px}.enemy-card{padding:9px 7px 10px;border-radius:12px}.enemy-card.selected{padding:8px 6px 9px}.enemy-art{height:70px;font-size:39px}.enemy-name{font-size:12px}.enemy-type{font-size:10px;min-height:28px}.atk{font-size:10px}.hp-row{font-size:10px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.action{padding:11px 6px}.player-card{grid-template-columns:60px minmax(0,1fr);gap:10px}.player-avatar{width:60px;height:60px;font-size:31px}.remaining{font-size:11px}.battle-board{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">🎴 校園女神錄</div><span class="test-tag">TEST BUILD · 不影響正式版</span></div>
  <section class="story">
    <h1>第 11 關｜被包圍的中庭</h1>
    <p>感染者正朝同一方向移動，彷彿受到某種訊號指揮。中庭已被層層包圍，突破包圍才能前往宿舍尋找倖存者。</p>
  </section>
  <div class="statusline"><span class="wave-label" id="waveLabel">第一波｜中庭遭遇戰</span><span class="remaining" id="remaining">剩餘敵人：2</span></div>
  <section class="enemy-grid" id="enemyGrid" aria-label="敵人卡牌"></section>
  <section class="battle-board">
    <div class="board-heading"><h2>我方戰鬥狀態</h2><span class="remaining" id="roundStatus">選擇敵人作為攻擊目標</span></div>
    <div class="player-card">
      <div class="player-avatar">🎓</div>
      <div>
        <div class="player-name">我方出戰角色</div><div class="player-sub">生命值與能量會在換波時保留</div>
        <div class="player-hp-label"><span>生命值</span><b id="playerHpText">100 / 100</b></div><div class="player-hp-track"><div class="player-hp-fill" id="playerHpFill"></div></div>
        <div class="energy-label"><span>✦ 能量</span><b id="energyText">60 / 100</b></div><div class="energy-track"><div class="energy-fill" id="energyFill"></div></div>
      </div>
    </div>
    <div class="actions">
      <button class="action primary" id="attackBtn">⚔️ 普通攻擊<small>恢復 15 能量</small></button>
      <button class="action" id="skillBtn">✨ 技能<small>消耗 35 能量</small></button>
      <button class="action" id="defendBtn">🛡️ 防禦<small>減少本回合傷害</small></button>
      <button class="action" id="healBtn">🧪 補給<small>恢復 20 生命值</small></button>
    </div>
    <div class="notice" id="notice" role="status" aria-live="polite">請點擊敵人卡牌選擇目標，再發動攻擊。</div>
    <div class="log"><h3>戰鬥紀錄</h3><div class="log-list" id="logList"></div></div>
    <div class="footer-actions"><button class="reset" id="resetBtn">↻ 重置測試</button><span class="footnote">此頁為互動原型，戰鬥資料不會寫入正式存檔。</span></div>
  </section>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="overlay-box"><h2 id="overlayTitle">第二波來襲</h2><p id="overlayText">敵人正在進入戰場……</p><button id="overlayBtn">開始戰鬥</button></div></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const waves=[
 [{id:"w1a",name:"初始感染體",icon:"🧟",desc:"普通近戰敵人",hp:46,maxHp:46,atk:6},{id:"w1b",name:"感染學生",icon:"🧟‍♀️",desc:"校園感染者",hp:50,maxHp:50,atk:7}],
 [{id:"w2a",name:"高速感染體",icon:"🏃‍♂️",desc:"迅捷感染者",hp:48,maxHp:48,atk:7},{id:"w2b",name:"異變感染體",icon:"👹",desc:"明顯生物異變",hp:62,maxHp:62,atk:8},{id:"w2c",name:"初始感染體",icon:"🧟",desc:"普通近戰敵人",hp:46,maxHp:46,atk:6}]
];
let waveIndex=0,enemies=[],selectedId=null,playerHp=100,energy=60,defending=false,locked=false,ended=false,coins=0;
function alive(){return enemies.filter(e=>e.alive&&!e.dying)}
function selected(){return enemies.find(e=>e.id===selectedId&&e.alive&&!e.dying)}
function log(t){const n=document.createElement("div");n.className="log-item";n.textContent=t;$("logList").prepend(n);while($("logList").children.length>9)$("logList").lastElementChild.remove()}
function tell(t){$("notice").textContent=t}
function lock(v){locked=v;["attackBtn","skillBtn","defendBtn","healBtn"].forEach(id=>$(id).disabled=v||ended||playerHp<=0)}
function render(){
 $("waveLabel").textContent=waveIndex===0?"第一波｜中庭遭遇戰":"第二波｜中庭包圍圈";
 $("remaining").textContent="剩餘敵人："+alive().length;
 $("playerHpText").textContent=playerHp+" / 100";$("playerHpFill").style.width=Math.max(0,playerHp)+"%";
 $("energyText").textContent=energy+" / 100";$("energyFill").style.width=energy+"%";
 $("roundStatus").textContent=locked?"波次切換中…":(selected()?"已選擇："+selected().name:"選擇敵人作為攻擊目標");
 const grid=$("enemyGrid");grid.innerHTML="";
 enemies.filter(e=>e.alive).forEach(e=>{
   const b=document.createElement("button");b.type="button";b.className="enemy-card"+(e.id===selectedId?" selected":"")+(e.dying?" dying":"")+(e.arrive?" arrive":"");b.disabled=locked||ended||playerHp<=0||e.dying;b.setAttribute("aria-pressed",String(e.id===selectedId));
   b.innerHTML='<div class="enemy-art" aria-hidden="true">'+e.icon+'</div><div class="enemy-name"></div><div class="enemy-type"></div><div class="hp-row"><span>生命值</span><b>'+Math.max(0,e.hp)+' / '+e.maxHp+'</b></div><div class="hp-track"><div class="hp-fill" style="width:'+Math.max(0,e.hp)/e.maxHp*100+'%"></div></div><div class="atk">基礎攻擊：<b>'+e.atk+'</b></div>';
   b.querySelector(".enemy-name").textContent=e.name;b.querySelector(".enemy-type").textContent=e.desc;
   b.addEventListener("click",()=>{if(locked||e.dying)return;selectedId=e.id;render()});grid.appendChild(b);e.arrive=false;
 });
 lock(locked);
}
function damageEnemy(e,amount,source){const actual=Math.min(e.hp,amount);e.hp=Math.max(0,e.hp-amount);log(source+"對「"+e.name+"」造成 "+actual+" 點傷害。");if(e.hp<=0){e.dying=true;log("「"+e.name+"」被擊敗！");setTimeout(()=>{e.alive=false;e.dying=false;if(selectedId===e.id)selectedId=alive()[0]?.id||null;render()},480)}return actual}
function playerTurn(source,amount,energyGain){
 if(locked||ended||playerHp<=0)return;
 const target=selected();if(!target){tell("請先點擊一張存活的敵人卡牌選擇目標。");return}
 damageEnemy(target,amount,source);energy=Math.min(100,energy+energyGain);
 if(alive().length===0){render();setTimeout(clearWave,650);return}
 tell("攻擊完成。存活敵人將由左至右依序反擊。");render();enemyCounter();
}
function enemyCounter(){
 if(locked||ended||playerHp<=0)return;
 const attackers=alive().slice();let total=0;
 for(const e of attackers){if(playerHp<=0)break;let hit=e.atk+Math.floor(Math.random()*3);if(defending)hit=Math.ceil(hit*.7);playerHp=Math.max(0,playerHp-hit);total+=hit;log("「"+e.name+"」反擊，造成 "+hit+" 點傷害。")}
 defending=false;render();
 if(playerHp<=0){ended=true;lock(true);tell("我方生命值歸零，測試戰鬥結束。請重置後再次測試。");return}
 tell("敵人依序反擊，合計造成 "+total+" 點傷害。");render();
}
function clearWave(){
 if(ended)return;
 if(waveIndex===0){
   locked=true;render();$("overlayTitle").textContent="第一波完成";$("overlayText").textContent="中庭另一側傳來異響……第二波感染者即將同時出現。";$("overlayBtn").textContent="迎戰第二波";$("overlay").classList.add("show");
   $("overlayBtn").onclick=()=>{ $("overlay").classList.remove("show");waveIndex=1;enemies=waves[1].map(e=>Object.assign({},e,{alive:true,dying:false,arrive:true}));selectedId=enemies[0].id;locked=true;render();$("overlayTitle").textContent="第二波｜中庭包圍圈";$("overlayText").textContent="三名感染者同時進入戰場。";$("overlayBtn").textContent="開始戰鬥";$("overlay").classList.add("show");$("overlayBtn").onclick=()=>{$("overlay").classList.remove("show");locked=false;render();tell("第二波開始！選擇敵人卡牌作為攻擊目標。");log("第二波三名敵人同時登場。")}};
 }else{
   ended=true;locked=true;coins=20;render();$("overlayTitle").textContent="第 11 關通關！";$("overlayText").textContent="第二波敵人全數擊敗。測試通關獎勵：20 金幣（僅為示意，不會存入正式存檔）。";$("overlayBtn").textContent="再測試一次";$("overlay").classList.add("show");$("overlayBtn").onclick=reset;
 }
}
function reset(){
 waveIndex=0;enemies=waves[0].map(e=>Object.assign({},e,{alive:true,dying:false,arrive:true}));selectedId=enemies[0].id;playerHp=100;energy=60;defending=false;locked=false;ended=false;coins=0;$("overlay").classList.remove("show");$("logList").innerHTML="";log("測試開始：第一波共 2 隻敵人。");tell("請點擊敵人卡牌選擇目標，再發動攻擊。");render();
}
$("attackBtn").addEventListener("click",()=>{const e=selected();if(!e){tell("請先選擇攻擊目標。");return}const d=21+Math.floor(Math.random()*7);playerTurn("普通攻擊",d,15)});
$("skillBtn").addEventListener("click",()=>{if(energy<35){tell("能量不足，需要 35 點能量。");return}const e=selected();if(!e){tell("請先選擇攻擊目標。");return}energy-=35;playerTurn("技能攻擊",34+Math.floor(Math.random()*8),0)});
$("defendBtn").addEventListener("click",()=>{if(locked||ended||playerHp<=0)return;defending=true;log("我方採取防禦姿態，本回合受到的敵人傷害降低 30%。");tell("防禦生效！存活敵人將由左至右反擊。");enemyCounter()});
$("healBtn").addEventListener("click",()=>{if(locked||ended||playerHp<=0)return;if(playerHp>=100){tell("生命值已滿，無需使用補給。");return}const n=Math.min(20,100-playerHp);playerHp+=n;log("使用補給，恢復 "+n+" 點生命值。");tell("補給生效，恢復 "+n+" 點生命值。");enemyCounter();render()});
$("resetBtn").addEventListener("click",reset);
reset();
})();
</script>
</body>
</html>
